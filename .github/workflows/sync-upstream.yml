name: Sync upstream

# Once a day: take the newest upstream tag onto main, test it there, and
# publish it when the tests pass. A conflict, or tests that fail, leave main
# alone and open an issue instead: a sync is never published unseen.
on:
  schedule:
    - cron: "0 3 * * *" # 11:00 in Shanghai
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to take (empty: the newest)"
        required: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    name: take the newest upstream tag
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM: yetone/magpie
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: The upstream tag to take
        id: up
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            # one request, no clone: the tags' newest version first
            tag=$(git ls-remote --tags --sort=-v:refname "https://github.com/$UPSTREAM.git" 'refs/tags/v0.1.*' \
              | { grep -v '\^{}' || true; } | head -1 | sed 's#.*refs/tags/##')
          fi
          if [ -z "$tag" ]; then
            echo "no upstream tag found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "newest upstream tag: $tag"

      - name: Is it newer than the one main has?
        id: check
        run: |
          set -euo pipefail
          base=$(git log -1 --format='%H %s' --grep='^upstream: ')
          if [ -z "$base" ]; then
            echo "this fork has no upstream commit" >&2
            exit 1
          fi
          have=${base#*upstream: }
          echo "main is on upstream $have"
          if [ "$have" = "${{ steps.up.outputs.tag }}" ]; then
            echo "take=false" >> "$GITHUB_OUTPUT"
            echo "nothing to do"
          else
            echo "take=true" >> "$GITHUB_OUTPUT"
            echo "base=${base%% *}" >> "$GITHUB_OUTPUT"
          fi

      - name: Put it on a branch, with this fork's patch
        id: build
        if: steps.check.outputs.take == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.up.outputs.tag }}"
          branch="sync/upstream-${tag#v}"
          git config user.name "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          # this fork's own changes, against the upstream tree it was made on
          git diff "${{ steps.check.outputs.base }}..HEAD" > /tmp/fork.patch
          echo "fork patch: $(grep -c '^diff --git' /tmp/fork.patch) files"
          git fetch --depth 1 "https://github.com/$UPSTREAM.git" "refs/tags/$tag"
          git switch -c "$branch"
          git read-tree --reset -u FETCH_HEAD
          git commit -q -m "upstream: $tag"
          if ! git apply --3way /tmp/fork.patch; then
            # This fork owns these whole: its pages and its pipelines. A
            # conflict in one of them is that, not an upstream change to
            # merge, so the fork's version is kept and the rest decided.
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                README.md|README.zh-CN.md|docs/fork.md|.github/workflows/release.yml|.github/workflows/test.yml|.github/workflows/test-macos.yml|.github/workflows/docker.yml)
                  git checkout --theirs -- "$f" 2>/dev/null || true
                  git add -- "$f"
                  echo "kept this fork's $f"
                  ;;
              esac
            done
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [ -n "$files" ]; then
              {
                echo "Taking upstream \`$tag\` onto main hit conflicts in this fork's patch."
                echo
                echo "Conflicted files: $files"
                echo
                echo "Resolve by hand:"
                echo
                echo '```'
                echo "git fetch https://github.com/$UPSTREAM.git refs/tags/$tag"
                echo "git switch -c sync/upstream-${tag#v} main"
                echo "git read-tree --reset -u FETCH_HEAD"
                echo "git commit -m 'upstream: $tag'"
                echo "git diff <last upstream commit>..main | git apply -3"
                echo '```'
                echo
                echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
              } > /tmp/issue.md
              gh issue create --title "上游同步冲突：$tag" --body-file /tmp/issue.md || true
              exit 0
            fi
          fi
          git add -A
          git commit -q -m "fork: carry the patches to upstream $tag"
          git push -f origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Test the branch, then fast-forward main
        if: steps.check.outputs.take == 'true' && steps.build.outputs.branch != ''
        env:
          BRANCH: ${{ steps.build.outputs.branch }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # a pull request, because a push to any branch but main starts no
          # test run; main waits for one on the commit it would publish
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "upstream: ${{ steps.up.outputs.tag }}" \
              --body "Taking upstream \`${{ steps.up.outputs.tag }}\` onto main, with this fork's patch. Merged and released when the tests pass."
          fi
          pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          echo "PR #$pr, commit $sha"
          conclusion=""
          for i in $(seq 1 90); do
            run=$(gh api "repos/$GH_REPO/actions/workflows/test.yml/runs?head_sha=$sha&per_page=10" \
              --jq '[.workflow_runs[] | select(.status == "completed")][0] // empty')
            if [ -n "$run" ]; then
              conclusion=$(echo "$run" | jq -r '.conclusion')
              echo "test run: $conclusion"
              break
            fi
            echo "waiting for the tests ($i)"
            sleep 60
          done
          if [ "$conclusion" != "success" ]; then
            {
              echo "Upstream \`${{ steps.up.outputs.tag }}\` is on branch \`$BRANCH\` (PR #$pr), and its tests did not pass (conclusion: ${conclusion:-none})."
              echo
              echo "Main is untouched. Fix it on the branch, or wait for the next tag."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/issue.md
            gh pr comment "$pr" --body-file /tmp/issue.md || true
            gh issue create --title "上游同步未通过测试：${{ steps.up.outputs.tag }}" --body-file /tmp/issue.md || true
            exit 1
          fi
          if ! git push origin "HEAD:main"; then
            {
              echo "Upstream \`${{ steps.up.outputs.tag }}\` passed its tests on branch \`$BRANCH\` (PR #$pr), but main moved while it ran, so it wasn't taken."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/issue.md
            gh issue create --title "上游同步无法快进：${{ steps.up.outputs.tag }}" --body-file /tmp/issue.md || true
            exit 1
          fi
          gh pr close "$pr" --comment "Fast-forwarded into main as $sha; released when its tests passed." || true
          echo "main is at $sha"

      - name: Release it
        if: steps.check.outputs.take == 'true' && steps.build.outputs.branch != ''
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          base=${latest#v}
          next="${base%.*}.$(( ${base##*.} + 1 ))"
          if gh release view "v$next" >/dev/null 2>&1; then
            echo "v$next is already released; nothing to publish"
            exit 0
          fi
          echo "publishing v$next for $sha"
          gh workflow run Release -f version="$next" --ref main
          conclusion=""
          for i in $(seq 1 90); do
            run=$(gh run list --workflow=Release --limit=5 \
              --json databaseId,headSha,status,conclusion \
              --jq "[.[] | select(.headSha == \"$sha\" and .status == \"completed\")][0] // empty")
            if [ -n "$run" ]; then
              conclusion=$(echo "$run" | jq -r '.conclusion')
              echo "release run: $conclusion"
              break
            fi
            echo "waiting for the release ($i)"
            sleep 60
          done
          if [ "$conclusion" != "success" ]; then
            {
              echo "Upstream \`${{ steps.up.outputs.tag }}\` is on main ($sha), and publishing v$next did not pass (conclusion: ${conclusion:-none})."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/issue.md
            gh issue create --title "发版未通过：v$next" --body-file /tmp/issue.md || true
            exit 1
          fi
          echo "released v$next"
