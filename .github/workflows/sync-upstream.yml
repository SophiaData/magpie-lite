name: Sync upstream

# Once a day: take the newest upstream tag onto main, test it there, and
# publish it when the tests pass. A conflict, or tests that fail, leave main
# alone and open an issue instead: a sync is never published unseen.
on:
  schedule:
    - cron: "0 3 * * *" # 11:00 in Shanghai
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to take (empty: the newest)"
        required: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    name: take the newest upstream tag
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM: yetone/magpie
      TAG_INPUT: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The build the tests use (test.yml): the GUI links GTK 3 and WebKitGTK
      # 4.1, and only that build registers every route the parity test walks.
      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: The upstream tag to take
        id: up
        run: |
          set -euo pipefail
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            # one request, no clone: the stable tags, newest version first
            tag=$(git ls-remote --tags --sort=-v:refname "https://github.com/$UPSTREAM.git" 'refs/tags/v*' \
              | { grep -v '\^{}' || true; } | sed 's#.*refs/tags/##' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed -n '1p')
          fi
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "no stable upstream tag (got '$tag')" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "newest upstream tag: $tag"

      - name: Is it newer than the one main has?
        id: check
        run: |
          set -euo pipefail
          tag="${{ steps.up.outputs.tag }}"
          base=$(git log -1 --format='%H %s' --grep='^upstream: ')
          if [ -z "$base" ]; then
            echo "this fork has no upstream commit" >&2
            exit 1
          fi
          have=${base#*upstream: }
          newest=$(printf '%s\n%s\n' "$have" "$tag" | sort -V | tail -1)
          echo "main is on upstream $have, newest is $tag"
          if [ "$have" = "$tag" ] || [ "$newest" != "$tag" ]; then
            echo "take=false" >> "$GITHUB_OUTPUT"
            echo "nothing to do"
          else
            echo "take=true" >> "$GITHUB_OUTPUT"
            echo "base=${base%% *}" >> "$GITHUB_OUTPUT"
          fi

      - name: Put it on a branch, with this fork's patch
        id: build
        if: steps.check.outputs.take == 'true'
        run: |
          set -euo pipefail
          notify() { # title, body-file
            local title="$1" file="$2" num
            num=$(gh issue list --state open --search 'sync-upstream in:title' \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file "$file" >/dev/null
            else
              gh issue create --title "$title" --body-file "$file" >/dev/null
            fi
            echo "notified: $title"
          }
          fail() { # title, body-file
            notify "$1" "$2"
            echo "::error::$1"
            exit 1
          }
          tag="${{ steps.up.outputs.tag }}"
          branch="sync/upstream-${tag#v}"
          git config user.name "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          # this fork's own changes, against the upstream commit it was based
          # on; its pipelines are its own too, and a push carrying workflow
          # files is refused to the token, so they are left as main has them
          git diff --binary "${{ steps.check.outputs.base }}..HEAD" -- . ':(exclude).github/workflows' > /tmp/fork.patch
          files=$(grep -c '^diff --git' /tmp/fork.patch || true)
          echo "fork patch: ${files:-0} files"
          if [ "${files:-0}" -eq 0 ]; then
            printf 'This fork has no changes against `%s`, so there is nothing to carry.\n' "${{ steps.check.outputs.base }}" > /tmp/body.md
            fail "[sync-upstream] 补丁为空：$tag" /tmp/body.md
          fi
          git fetch --depth 1 "https://github.com/$UPSTREAM.git" "refs/tags/$tag"
          git switch -c "$branch"
          # two commits, as this fork's syncs have always been: a pure upstream
          # tree, and this fork's patch on it. The next sync's base is the
          # first of them, so the second is the patch it replays.
          git read-tree --reset -u FETCH_HEAD
          git rm -rq -f --ignore-unmatch .github/workflows
          git checkout HEAD -- .github/workflows
          git add -A
          git commit -q -m "upstream: $tag"
          upstream_commit=$(git rev-parse --short HEAD)
          echo "upstream tree: $upstream_commit"
          if ! git apply --3way /tmp/fork.patch; then
            # this fork owns its pages whole: a conflict in one of them is
            # that, not an upstream change to merge
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                README.md|README.zh-CN.md|docs/fork.md)
                  if git checkout --theirs -- "$f" 2>/dev/null; then
                    git add -- "$f"
                    echo "kept this fork's $f"
                  fi
                  ;;
              esac
            done
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [ -n "$conflicts" ]; then
              {
                echo "Taking upstream \`$tag\` onto main did not replay this fork's patch."
                echo
                echo "Conflicted files: $conflicts"
                echo
                echo "Resolve by hand:"
                echo
                echo '```'
                echo "git fetch https://github.com/$UPSTREAM.git refs/tags/$tag"
                echo "git switch -c sync/upstream-${tag#v} main"
                echo "git read-tree --reset -u FETCH_HEAD"
                echo "git diff <last upstream commit>..main | git apply -3"
                echo '```'
                echo
                echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
              } > /tmp/body.md
              fail "[sync-upstream] 上游同步冲突：$tag" /tmp/body.md
            fi
          fi
          # This fork's patch carries the fixes the upstream tree had not made
          # when it was written. When upstream makes one itself, the replayed
          # line is a duplicate map key: that line is the one vet names, and
          # only those are dropped, until vet is clean.
          for i in $(seq 1 10); do
            if env -u GH_TOKEN go vet -tags gtk3 ./... > /tmp/vet.log 2>&1; then
              break
            fi
            dups=$(grep -oE '[^ ]+\.go:[0-9]+:[0-9]+: duplicate key' /tmp/vet.log | sort -u || true)
            if [ -z "$dups" ]; then
              break
            fi
            for d in $dups; do
              f=${d%%:*}
              rest=${d#*:}
              n=${rest%%:*}
              if [ -f "$f" ]; then
                printf '%s\n' "$n $f"
              fi
            done | sort -rn | while read -r n f; do
              sed -i "${n}d" "$f"
              echo "dropped now-duplicate line $f:$n"
            done
          done
          if ! env -u GH_TOKEN go vet -tags gtk3 ./... > /tmp/vet.log 2>&1; then
            cat /tmp/vet.log
            {
              echo "Upstream \`$tag\` and this fork's patch do not fit: vet fails after the replay."
              echo
              echo '```'
              tail -30 /tmp/vet.log
              echo '```'
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/body.md
            fail "[sync-upstream] 补丁与上游不合：$tag" /tmp/body.md
          fi
          # The other way the fork's patch goes stale: a route upstream adds
          # that the parity test asks a note on. The note is a line in that
          # test's own notYet map, and only the routes it names get one.
          for i in $(seq 1 5); do
            if env -u GH_TOKEN go test -tags gtk3 ./internal/cli -run '^TestEveryRouteHasACommandOrIsNamed$' -count=1 > /tmp/parity.log 2>&1; then
              break
            fi
            routes=$(sed -nE 's/.*: ([A-Z]+ \/[^ ]*) has no command:.*/\1/p' /tmp/parity.log | sort -u || true)
            if [ -z "$routes" ]; then
              break
            fi
            printf '%s\n' "$routes" > /tmp/routes.txt
            echo '' | base64 -d > /tmp/note-routes.py
            python3 /tmp/note-routes.py
            gofmt -w internal/cli/settings_parity_test.go
          done
          if ! env -u GH_TOKEN go test -tags gtk3 ./internal/cli -run '^TestEveryRouteHasACommandOrIsNamed$' -count=1 > /tmp/parity.log 2>&1; then
            cat /tmp/parity.log
            {
              echo "Upstream \`$tag\` still leaves a route the parity test has no note for."
              echo
              echo '```'
              tail -30 /tmp/parity.log
              echo '```'
            } > /tmp/body.md
            fail "[sync-upstream] 路由说明补不齐：$tag" /tmp/body.md
          fi
          git add -A
          git commit -q -m "fork: carry the patches to upstream $tag"
          if ! git push -f origin "HEAD:$branch"; then
            {
              echo "Taking upstream \`$tag\` onto main could not push branch \`$branch\`."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/body.md
            fail "[sync-upstream] 无法推送同步分支：$tag" /tmp/body.md
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Test the branch, then fast-forward main
        if: steps.check.outputs.take == 'true' && steps.build.outputs.branch != ''
        env:
          BRANCH: ${{ steps.build.outputs.branch }}
        run: |
          set -euo pipefail
          notify() { # title, body-file
            local title="$1" file="$2" num
            num=$(gh issue list --state open --search 'sync-upstream in:title' \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file "$file" >/dev/null
            else
              gh issue create --title "$title" --body-file "$file" >/dev/null
            fi
            echo "notified: $title"
          }
          sha=$(git rev-parse HEAD)
          conclusion=""
          # asked for by hand: a token's pull request starts no run until
          # someone approves it, which nothing does here. A run may flake, so
          # a failed one is asked for once more.
          for attempt in 1 2; do
            # the run this attempt starts, not the one before it: both carry
            # the same head sha, and the earlier one is already completed.
            # REST names the run id `id`; `databaseId` is the CLI's name.
            before=$(gh api "repos/$GH_REPO/actions/workflows/test.yml/runs?head_sha=$sha&per_page=1" \
              --jq '.workflow_runs[0].id // 0')
            gh workflow run test.yml --ref "$BRANCH"
            echo "asked Test for $sha (attempt $attempt, after run $before)"
            sleep 20
            conclusion=""
            for i in $(seq 1 30); do
              run=$(gh api "repos/$GH_REPO/actions/workflows/test.yml/runs?head_sha=$sha&per_page=10" \
                --jq "[.workflow_runs[] | select(.status == \"completed\" and .id > $before)][0] // empty")
              if [ -n "$run" ]; then
                conclusion=$(echo "$run" | jq -r '.conclusion')
                echo "test run: $conclusion"
                break
              fi
              echo "waiting for the tests ($i)"
              sleep 60
            done
            if [ "$conclusion" = "success" ]; then
              break
            fi
            echo "attempt $attempt did not pass (${conclusion:-none})"
          done
          if [ "$conclusion" != "success" ]; then
            {
              echo "Upstream \`${{ steps.up.outputs.tag }}\` is on branch \`$BRANCH\`, and its tests did not pass (conclusion: ${conclusion:-none})."
              echo
              echo "Main is untouched. Fix it on the branch, or wait for the next tag."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/body.md
            notify "[sync-upstream] 上游同步未通过测试：${{ steps.up.outputs.tag }}" /tmp/body.md
            echo "::error::tests did not pass; main is untouched"
            exit 1
          fi
          if ! git push origin "HEAD:main"; then
            {
              echo "Upstream \`${{ steps.up.outputs.tag }}\` passed its tests on branch \`$BRANCH\`, but main moved while it ran, so it wasn't taken."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/body.md
            notify "[sync-upstream] 无法快进 main：${{ steps.up.outputs.tag }}" /tmp/body.md
            exit 1
          fi
          git push origin --delete "$BRANCH" || true
          echo "main is at $sha"

      - name: Release it
        if: steps.check.outputs.take == 'true' && steps.build.outputs.branch != ''
        run: |
          set -euo pipefail
          notify() { # title, body-file
            local title="$1" file="$2" num
            num=$(gh issue list --state open --search 'sync-upstream in:title' \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file "$file" >/dev/null
            else
              gh issue create --title "$title" --body-file "$file" >/dev/null
            fi
            echo "notified: $title"
          }
          close_issues() { # comment
            for n in $(gh issue list --state open --search 'sync-upstream in:title' \
              --json number --jq '.[].number' 2>/dev/null || true); do
              gh issue close "$n" --comment "$1" || true
            done
          }
          sha=$(git rev-parse HEAD)
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          base=${latest#v}
          next="${base%.*}.$(( ${base##*.} + 1 ))"
          drafted=""
          if drafted=$(gh release view "v$next" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$drafted" = "true" ]; then
              {
                echo "v$next is a draft left by an earlier run, so the next version can't be published."
                echo
                echo "Delete it and run this again: \`gh release delete v$next\`"
              } > /tmp/body.md
              notify "[sync-upstream] 发版被草稿挡住：v$next" /tmp/body.md
              exit 1
            fi
            echo "v$next is already released; nothing to publish"
            close_issues "v$next 已存在；main 已同步到 \`${{ steps.up.outputs.tag }}\`。"
            exit 0
          fi
          echo "publishing v$next for $sha"
          gh workflow run release.yml -f version="$next" --ref main
          conclusion=""
          for i in $(seq 1 40); do
            run=$(gh run list --workflow=release.yml --limit=5 \
              --json databaseId,headSha,status,conclusion \
              --jq "[.[] | select(.headSha == \"$sha\" and .status == \"completed\")][0] // empty")
            if [ -n "$run" ]; then
              conclusion=$(echo "$run" | jq -r '.conclusion')
              echo "release run: $conclusion"
              break
            fi
            echo "waiting for the release ($i)"
            sleep 60
          done
          if [ "$conclusion" != "success" ]; then
            {
              echo "Upstream \`${{ steps.up.outputs.tag }}\` is on main ($sha), and publishing v$next did not pass (conclusion: ${conclusion:-none})."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/body.md
            notify "[sync-upstream] 发版未通过：v$next" /tmp/body.md
            exit 1
          fi
          echo "released v$next"
          close_issues "v$next 已发布，main 已在 \`${{ steps.up.outputs.tag }}\`。"
