name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main a run finishes: a release waits for a green run, and one cancelled
# by every next push left none to wait for (LESSONS.md). A newer push still
# replaces a run that hasn't started. A PR's run is cancelled by its next push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # One runner's whole suite took as long as the other three jobs together
  # (gofmt and vet 2 minutes, the suite 12, the race detector's 14), so the
  # checks are split over three runners that run at once: the slowest of them
  # is now the run's length, not their sum.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The GUI links GTK 3 and WebKitGTK 4.1 through cgo on Linux (see the
      # Makefile), so vet needs their headers and the gtk3 tag.
      # A stuck apt mirror held main's run here for 2.5 hours (b0d456c3), and
      # every later push queued behind it; it takes under a minute.
      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        id: tags
        run: echo "tags=gtk3" >> "$GITHUB_OUTPUT"

      # Unformatted files reached main 8 times from 10-01 to 10-06 and each
      # took a gofmt commit of its own. Linux only: Windows checks out CRLF.
      - name: Gofmt
        shell: bash
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

      - name: Vet
        run: go vet -tags "${{ steps.tags.outputs.tags }}" ./...

  unit:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        id: tags
        run: echo "tags=gtk3" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # A package slower than Go's 10-minute default must not fail the run
      # that a release waits for (LESSONS.md, "A full run gives the slow
      # packages room").
      - name: Test
        run: go test -timeout 45m -tags "${{ steps.tags.outputs.tags }}" ./...

      - name: Production plugin flow
        timeout-minutes: 10
        env:
          MAGPIE_FLOW_BIG: '1'
        run: |
          bun --version
          go test -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/plugin/... -run '^TestFlowBigReplyProd$' -count=1

  # The redaction tests reuse this binary in fresh processes to check
  # first-use races, so it must include the race detector. The gateway's
  # tests can't call t.Parallel (t.Setenv), so its suite runs split over
  # one process per core (#923); each process isolates its own home.
  race:
    name: race (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        id: tags
        run: echo "tags=gtk3" >> "$GITHUB_OUTPUT"

      - name: Race
        shell: bash
        run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" -tags "${{ steps.tags.outputs.tags }}" ./internal/gateway/
          build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.race" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=20m
          go test -race -tags "${{ steps.tags.outputs.tags }}" ./internal/redact/

      # Account usage mixes cached results with concurrent fetches.
      - name: Race account usage
        run: go test -race -tags "${{ steps.tags.outputs.tags }}" ./internal/provider/ -run '^Test(LoginUsage|SubscriptionUsageEachAccount)'

  windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Windows skips the suite above, so the two plugin stderr tests run
      # here. The end-to-end one needs bun on PATH; without it it skips.
      - name: Plugin stderr tests (Windows)
        shell: bash
        run: |
          bun --version
          go test -v -count=1 ./internal/plugin/ -run '^(TestHostStartsPastAnOverlongStderrLine|TestDrainStderrKeepsTheChildGoing)$'

      # Some tests fake a home through $HOME, which Windows doesn't read
      # (USERPROFILE), or assume Unix file modes. Compile the full suite
      # on Windows and run the isolated native checks below.
      - name: Compile tests
        run: go test -run '^$' ./...

      # These checks use in-memory errors and loopback test servers. Run
      # the native Winsock refusal case rather than only compiling it.
      - name: Windows MCP health
        run: go test -v -count=1 -timeout 2m ./internal/library -run '^(TestNetHealth|TestCheckHTTP)$'

      # Usage isolates USERPROFILE and the agent homes; execute its native
      # ChangeTime checks rather than only cross-compiling the Windows API.
      - name: Windows usage cache
        run: go test -v -count=1 ./internal/usage -run '^(TestWindows|TestLogChange|TestLogFileInfoPreservesIdentity$|TestUsageSameSizeAndMtimeRewrite$|TestLogGrowingRewriteThenAppend$|TestUsagePageCacheAfterUncachedQuery$)'

      # Install tests keep their files in t.TempDir; exercise real Windows
      # executable and held-handle rename/rollback behavior, and the trial
      # start before the install (#2272).
      - name: Windows update install
        run: go test -v -count=1 -timeout 2m ./internal/update -run '^(TestInstallBinary|TestMoveAside|TestTrialStart)'

      # These tests use temporary paths, without the Unix HOME assumptions
      # of the full suite. Run the native link-kind and sharing-error checks,
      # and the Codex copy checks that read NTFS ChangeTime (#1299).
      - name: Windows session moves
        run: go test -v -count=1 ./internal/sessions -run '^Test(WindowsSession|Move|CopyAll|CodexArchived|CodexSameTick|CodexPlainTwin)'

      # dsh's layered config is read and edited in temporary homes. Run
      # these checks on Windows too, including Desktop's home patch layer.
      - name: Windows dsh configuration
        run: go test -v -count=1 ./internal/agent -run '^Test(Dsh|KeepDsh)'

      - name: Windows VS Code detection
        run: go test -v -count=1 ./internal/agent -run '^TestVSCodeDetected$'

  cli:
    name: cli (${{ matrix.goos }}/${{ matrix.goarch }}, nogui)
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: android
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the terminal-only release
        env:
          CGO_ENABLED: '0'
        run: make release-cli TARGETS="${{ matrix.goos }}/${{ matrix.goarch }}"
      # The site is upstream's (deployed at usemagpie.ai) and this fork does
      # not publish it, so its tests — which hold both READMEs to the
      # sponsors' links — are not run here. The installer's syntax is still
      # checked, as a release builds it.
      - name: Test the installer
        if: matrix.goos == 'linux'
        run: sh -n site/public/install.sh
