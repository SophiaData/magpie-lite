name: Release

# Build this fork's own release here: the Windows and Linux desktop builds
# and the terminal-only builds, published on this repository's Releases
# page. This build reads and installs its updates from there
# (internal/update), never from yetone/magpie-releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no v prefix (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Read the version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="$INPUT_VERSION"
            TAG="v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building $TAG"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the desktop app and the terminal builds
        shell: bash
        env:
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          make release-windows VERSION="$VERSION"
          make release-cli TARGETS="windows/amd64 windows/arm64" VERSION="$VERSION"
          make release-cli TARGETS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 android/arm64" VERSION="$VERSION"

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-cli
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the desktop app (Linux)
        env:
          VERSION: v${{ needs.version.outputs.version }}
        run: make release-linux VERSION="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          {
            echo "magpie $VERSION"
            echo
            echo "Built from $GITHUB_REPOSITORY at ${GITHUB_SHA::12}."
            echo
            echo "## Install"
            echo
            echo "Download \`magpie-windows-amd64.exe\` (desktop app) or"
            echo "\`magpie-cli-windows-amd64.exe\` (terminal build)."
            echo
            echo "Automatic updates are off in this build: nothing is checked,"
            echo "downloaded or installed by itself. Ask for a check from"
            echo "Settings' Check, or run \`magpie update\`."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" dist/* --title "magpie $TAG" --notes-file notes.md --target main --latest
          fi
          gh release view "$TAG" --json assets -q '.assets[].name'
