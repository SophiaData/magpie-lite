name: Release

# Build this fork's own release here: the Windows, Linux and macOS desktop
# builds and the terminal-only builds, published on this repository's Releases
# page. This build reads and installs its updates from there
# (internal/update): feed.json and notes.json are built beside the binaries
# and attached to every release, and releases/latest/download serves them.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no v prefix (e.g. 0.2.1)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Read the version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="$INPUT_VERSION"
            TAG="v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building $TAG"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the desktop app and the terminal builds
        shell: bash
        env:
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          make release-windows VERSION="$VERSION"
          make release-cli TARGETS="windows/amd64 windows/arm64" VERSION="$VERSION"
          make release-cli TARGETS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 android/arm64" VERSION="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-cli
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the desktop app (Linux)
        env:
          VERSION: v${{ needs.version.outputs.version }}
        run: make release-linux VERSION="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The Intel runner answered "No space left on device" to hdiutil while
      # the root volume showed room: hdiutil works in TMPDIR, so keep that
      # on the workspace's volume, and the build cache is what fills a disk.
      - name: Free disk space
        run: |
          df -h
          echo "TMPDIR=$TMPDIR"
          go clean -cache
          df -h

      - name: Build the desktop app bundle
        env:
          VERSION: v${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TMPDIR: ${{ runner.temp }}
        run: |
          test "$(go env GOOS)" = darwin
          test "$(go env GOARCH)" = "$ARCH"
          make release-darwin VERSION="$VERSION"
          test -f "dist/magpie-darwin-$ARCH.zip"
          test -f "dist/magpie-darwin-$ARCH.dmg"
          # verify can answer "Resource temporarily unavailable" right after
          # the image is written, so give it a few tries; the mount below is
          # what holds the image to its contents.
          verified=no
          for try in 1 2 3; do
            if hdiutil verify "dist/magpie-darwin-$ARCH.dmg"; then verified=yes; break; fi
            echo "hdiutil verify failed (try $try)"
            sleep 5
          done
          test "$verified" = yes
          MNT="$RUNNER_TEMP/dmg"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "dist/magpie-darwin-$ARCH.dmg"
          test -x "$MNT/magpie.app/Contents/MacOS/magpie"
          test -L "$MNT/Applications"
          codesign --verify --deep --strict "$MNT/magpie.app"
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/magpie-darwin-${{ matrix.arch }}.zip
            dist/magpie-darwin-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The release's notes
        run: |
          set -euo pipefail
          # What this build carries: the upstream release it took, and the
          # commits this fork added on top of the release before it.
          python3 - <<'PY'
          import os, subprocess

          version = os.environ["VERSION"]
          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GH_REPO"]

          def gh(*args):
              r = subprocess.run(["gh", *args], capture_output=True, text=True, encoding="utf-8")
              return r.stdout.strip() if r.returncode == 0 else ""

          upstream = ""
          subject = subprocess.run(
              ["git", "log", "-1", "--format=%s", "--grep=^upstream: "],
              capture_output=True, text=True, encoding="utf-8").stdout.strip()
          if subject.startswith("upstream: "):
              upstream = subject[len("upstream: "):]

          lines = [f"magpie {version}", ""]
          built = f"基于本仓库提交 {sha[:12]} 构建。"
          if upstream:
              built = f"基于本仓库提交 {sha[:12]} 构建，包含上游 {upstream} 的改动。"
          lines += [built, ""]

          if upstream:
              body = gh("api", f"repos/yetone/magpie/releases/tags/{upstream}", "--jq", ".body")
              if body:
                  zh = body.split("<!-- lang:zh -->", 1)[1] if "<!-- lang:zh -->" in body else body
                  cut = zh.find("### 安装")
                  if cut >= 0:
                      zh = zh[:cut]
                  zh = zh.strip()
                  if zh:
                      lines += [f"## 上游变更（{upstream}）", "", zh, ""]

          prev = gh("api", f"repos/{repo}/releases/latest", "--jq", ".tag_name")
          if prev:
              out = gh("api", f"repos/{repo}/compare/{prev}...{sha}", "--jq",
                       '.commits[].commit.message | split("\\n")[0]')
              commits = [c for c in out.splitlines() if c and not c.startswith("upstream: ")]
              if commits:
                  lines += ["## 本仓库改动", ""]
                  lines += [f"- {c}" for c in commits[:40]]
                  lines += [""]

          lines += [
              "本版自动更新是关闭的：不会自己检查、下载或重启。要检查更新，",
              "在设置里点「检查」，或运行 `magpie update`。",
              "",
              "## 安装",
              "",
              "Windows：下载 `magpie-windows-amd64.exe`（ARM 机器用 `magpie-windows-arm64.exe`）。",
              "macOS：`magpie-darwin-arm64.dmg`（Apple 芯片）或 `magpie-darwin-amd64.dmg`",
              "（Intel），打开后把 magpie 拖进「应用程序」；`magpie update` 用的是对应的 `.zip`。",
              "终端版：`magpie-cli-<系统>-<架构>`。",
              "macOS 包为 ad-hoc 签名、未公证，首次打开可能被系统拦下，",
              "在「系统设置 › 隐私与安全性」里点「仍要打开」（或右键图标选「打开」）即可。",
          ]
          open("notes.md", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

      - name: Build feed.json and notes.json
        run: |
          set -euo pipefail
          # The releases published before this one, which notes.json carries.
          gh api "repos/$GH_REPO/releases?per_page=100" > prev.json || echo '[]' > prev.json
          python3 - <<'PY'
          import hashlib, json, os

          repo = os.environ["GH_REPO"]
          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          notes = open("notes.md", encoding="utf-8").read()
          page = f"https://github.com/{repo}/releases/tag/{tag}"

          assets = {}
          for name in sorted(os.listdir("dist")):
              if name in ("feed.json", "notes.json"):
                  continue
              path = os.path.join("dist", name)
              if not os.path.isfile(path):
                  continue
              assets[name] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "size": os.path.getsize(path),
                  "sha256": hashlib.sha256(open(path, "rb").read()).hexdigest(),
              }
          feed = {"version": version, "notes": notes, "url": page, "assets": assets}
          open("dist/feed.json", "w", encoding="utf-8").write(
              json.dumps(feed, ensure_ascii=False, indent=1))

          releases = []
          try:
              prev = json.load(open("prev.json", encoding="utf-8"))
          except Exception:
              prev = []
          for r in prev:
              if r.get("draft") or r.get("prerelease"):
                  continue
              t = r.get("tag_name") or ""
              releases.append({
                  "version": t[1:] if t.startswith("v") else t,
                  "notes": r.get("body") or "",
                  "url": r.get("html_url") or "",
              })
          releases.insert(0, {"version": version, "notes": notes, "url": page})
          open("dist/notes.json", "w", encoding="utf-8").write(
              json.dumps({"releases": releases}, ensure_ascii=False, indent=1))
          PY

      - name: Test passed on this commit
        run: |
          set -euo pipefail
          ok=$(gh api "repos/$GH_REPO/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=20" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$ok" -eq 0 ]; then
            echo "Test has not passed on $GITHUB_SHA; this refuses to publish until it does" >&2
            exit 1
          fi

      - name: Publish the release
        run: |
          set -euo pipefail
          ls -l dist
          # A draft first, every asset uploaded, then Latest: a release never
          # shows a half-uploaded set to `releases/latest/download`.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --notes-file notes.md --latest
          else
            gh release create "$TAG" --draft --title "magpie $TAG" --notes-file notes.md --target main
            gh release upload "$TAG" dist/*
            gh release edit "$TAG" --draft=false --notes-file notes.md --latest
          fi
          gh release view "$TAG" --json assets -q '.assets[].name'
